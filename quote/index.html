<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico">
<title>트리랜드 견적서 발행</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 관리자용 견적서 발행: 왼쪽 입력, 오른쪽 A4 미리보기. 가격은 홈페이지 가격표에서 읽어 옴 */
:root{
  --bg:#fafaf9; --paper:#ffffff; --ink:#1a1a19; --sub:#5f5f5b; --line:#dcdcd7; --soft:#f0f0ec;
  --act:#1a1a19; --act-ink:#ffffff; --err:#b3261e; --ok:#2e6b3a;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --paper:#1d1d1b; --ink:#ececea; --sub:#a3a39e; --line:#3a3a37; --soft:#262624;
  --act:#ececea; --act-ink:#141413; --err:#f2b8b5; --ok:#9fd3a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --paper:#1d1d1b; --ink:#ececea; --sub:#a3a39e; --line:#3a3a37; --soft:#262624;
  --act:#ececea; --act-ink:#141413; --err:#f2b8b5; --ok:#9fd3a8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;padding-top:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--sub)}
h1{font-size:22px;margin:2px 0 0}
.status{font-size:13px;color:var(--sub);margin:0}
.status.err{color:var(--err)}
.links{display:flex;gap:12px;font-size:13px}
.links a{color:var(--sub)}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:400;color:var(--sub);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--sub)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;font-size:14px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--sub);margin:0}
.hint.err{color:var(--err)}
button{font:inherit;cursor:pointer}
.primary{background:var(--act);color:var(--act-ink);border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:700}
.primary[disabled],.ghost[disabled]{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:13.5px}
.link{background:none;border:0;padding:2px 0;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:2px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.card-hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:8px 6px;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--act);color:var(--act-ink);font-weight:700}
.seg button[disabled]{color:var(--sub);cursor:not-allowed}
.price-line{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;font-size:14px}
.radios input{width:auto}
.inline{display:flex;gap:8px;align-items:center}
.inline input{width:90px}
.total-box{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.total-box b{font-size:20px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions .primary{grid-column:1/-1}
.hist{display:flex;flex-direction:column}
.hist .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist .it:first-child{border-top:0}
.hist .m{color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.hist .acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 10px;align-items:center}

/* 미리보기 */
.preview{position:sticky;top:12px;min-width:0}
@media (max-width:980px){.preview{position:static}}
.stage{width:100%;overflow:hidden;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.08);background:#fff}
.stage-inner{transform-origin:0 0;width:794px}

/* ── A4 견적서 (항상 흰 종이) ── */
#paper{--row:30px;width:794px;height:1123px;background:#fff;color:#000;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
  padding:30px 34px;position:relative;font-size:12.6px;line-height:1.35;-webkit-font-smoothing:antialiased}
#paper .frame{border:3px double #000;height:100%;padding:16px 26px 0;display:flex;flex-direction:column;overflow:hidden}
#paper .no{font-size:11.5px}
#paper .title{text-align:center;margin:2px 0 14px}
#paper .title span{display:inline-block;font-size:30px;font-weight:700;white-space:pre;padding:0 .15em 3px;border-bottom:4px double #000;line-height:1.2}
#paper table{border-collapse:collapse;width:100%;table-layout:fixed}
#paper td,#paper th{border:1px solid #000;padding:4px 7px;vertical-align:middle;font-weight:400}
#paper th{font-weight:700}
#paper .c{text-align:center}
#paper .r{text-align:right;font-variant-numeric:tabular-nums}
#paper .b{font-weight:700}
#paper .sm{font-size:10.5px}
#paper .xs{font-size:9.5px;line-height:1.2}
#paper .top{display:grid;grid-template-columns:47% 53%;align-items:stretch}
#paper .to{display:flex;flex-direction:column;justify-content:center;gap:14px;padding-right:18px;border-bottom:1.5px solid #000}
#paper .to .ln{border-bottom:1px solid #000;padding-bottom:5px;font-size:13.5px}
#paper .to .cust{font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
#paper .to .cust span:last-child{white-space:nowrap}
#paper .sup{border:1.5px solid #000}
#paper .sup td{height:26px;text-align:center;font-size:12px}
#paper .sup .v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.9em;font-weight:700;width:30px;font-size:13px}
#paper .sup .k{width:96px;font-size:11.5px}
#paper .seal{display:inline-flex;align-items:center;gap:6px}
#paper .seal img{width:26px;height:26px;object-fit:contain}
#paper .amount{margin-top:14px;border:1.5px solid #000}
#paper .amount td{height:40px;border:0;font-size:14.5px}
#paper .amount td:first-child{width:32%;font-weight:700;border-right:1px solid #000}
#paper .amount td:last-child{text-align:center;font-weight:700;font-size:15px}
#paper h3{font-size:13px;margin:14px 0 5px;font-weight:700}
#paper .grid thead th{border-top:2px solid #000;border-bottom:2px solid #000;font-size:11.5px;height:24px}
#paper .grid tbody td{height:var(--row);padding-top:1px;padding-bottom:1px}
#paper .grey{background:#f2f2f2}
#paper .sum{margin-top:0}
#paper .sum td{height:23px;font-size:12px}
#paper .sum .first td{border-top:2px solid #000}
#paper .sum .strong td{font-weight:700;font-size:13px}
#paper .sum .top2 td{border-top:2px solid #000}
#paper .sum .total td{font-weight:700;font-size:15.5px;height:32px}
#paper .notes{vertical-align:top!important;padding:10px 12px!important;font-size:12.3px;line-height:1.45}
#paper .notes .h{font-weight:700;margin-bottom:6px}
#paper .notes .v1{font-weight:700}
#paper .notes .v2{font-size:10.8px;margin:1px 0 6px}
#paper .notes ul{list-style:none;margin:0;padding:0}
#paper .notes li{padding-left:12px;position:relative;margin:0 0 3px}
#paper .notes li::before{content:"·";position:absolute;left:2px}
#paper .notes .warn{font-size:10.8px;margin-top:6px}
#paper .fill{flex:1}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .app>*:not(.preview),header{display:none!important}
  .app{display:block;max-width:none}
  .preview{position:static}
  .stage{box-shadow:none;border-radius:0;width:210mm!important;height:auto!important}
  .stage-inner{transform:none!important}
  #paper{width:210mm;height:297mm}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">TREELAND</div>
      <h1>견적서 발행</h1>
      <p class="status" id="status">홈페이지 가격표를 불러오는 중…</p>
    </div>
    <nav class="links"><a href="/admin">계약 관리</a><a href="/schedule">일정표</a><a href="/ledger">장부</a><a href="/stats">통계</a><a href="/proposals">제안서</a></nav>
  </header>

  <div class="form" id="form" aria-busy="true">
    <section>
      <h2>받는 곳</h2>
      <div class="field"><label for="cust">상호 (귀하 앞)</label><input id="cust" placeholder="예: 주식회사 원엔드" autocomplete="off"></div>
      <div class="grid2">
        <div class="field"><label for="qno">견적 번호</label><input id="qno" autocomplete="off"></div>
        <div class="field"><label for="qdate">견적일</label><input id="qdate" type="date"></div>
      </div>
    </section>

    <section>
      <h2>트리 <small id="treeCount"></small></h2>
      <div id="trees" class="form" style="gap:10px"></div>
      <button type="button" class="ghost" id="addTree">+ 트리 추가</button>
    </section>

    <section>
      <h2>추가 장식 <small>없으면 비워 두세요</small></h2>
      <div id="addons" class="form" style="gap:10px"></div>
      <button type="button" class="ghost" id="addAddon">+ 추가 장식</button>
    </section>

    <section>
      <h2>운임</h2>
      <div class="grid2">
        <div class="field"><label for="region">지역</label><select id="region"></select></div>
        <div class="field"><label for="ship">금액 (원)</label><input id="ship" type="number" inputmode="numeric" step="10000" min="0"></div>
      </div>
      <div class="field"><label for="shipLabel">견적서 표기</label><input id="shipLabel" placeholder="예: 경기 성남시"></div>
      <p class="hint" id="shipHint"></p>
    </section>

    <section>
      <h2>할인</h2>
      <div class="radios" id="phase">
        <label><input type="radio" name="phase" value="e1"> <span id="e1Label">1차 얼리버드</span></label>
        <label><input type="radio" name="phase" value="e2"> 2차 얼리버드 <span class="inline"><input id="e2Pct" type="number" inputmode="numeric" min="0" max="50" placeholder="%"> %</span></label>
        <label><input type="radio" name="phase" value="none"> 할인 없음 (정가)</label>
      </div>
      <div class="field" id="multiBox" hidden><label for="multiPct">여러 그루 추가 할인 (4그루 이상은 직접 입력)</label>
        <div class="inline"><input id="multiPct" type="number" inputmode="numeric" min="0" max="50"> %</div></div>
      <p class="hint" id="multiHint"></p>
    </section>

    <section>
      <h2>비고 추가 <small>한 줄에 하나, 선택</small></h2>
      <textarea id="extraNotes" placeholder="기본 비고 아래에 붙습니다"></textarea>
    </section>

    <section>
      <div class="total-box"><span>합계 (부가세 포함)</span><b id="totalOut">0원</b></div>
      <p class="hint err" id="problems" hidden></p>
      <p class="hint err" id="overflow" hidden></p>
      <div class="actions">
        <button type="button" class="primary" id="pdfBtn">PDF 저장</button>
        <button type="button" class="ghost" id="pngBtn">이미지 저장</button>
        <button type="button" class="ghost" id="copyBtn">카톡 요약</button>
        <button type="button" class="ghost" id="newBtn">새 견적</button>
      </div>
      <p class="hint" id="actMsg" role="status"></p>
    </section>

    <section>
      <h2>도장 <small id="stampState"></small></h2>
      <p class="hint">대표 도장이 자동으로 찍힙니다. 다른 도장을 쓰려면 아래에서 고르세요 (이 기기에만 적용).</p>
      <div class="inline" style="flex-wrap:wrap"><input type="file" id="stampFile" accept="image/*" style="width:auto;flex:1"><button type="button" class="link" id="stampClear">기본 도장으로</button></div>
    </section>

    <section>
      <h2>발행 내역 <small>이 기기에 저장</small></h2>
      <div class="hist" id="hist"><p class="hint">아직 저장한 견적이 없습니다.</p></div>
    </section>
  </div>

  <div class="preview">
    <div class="stage" id="stage"><div class="stage-inner" id="stageInner"><div id="paper"></div></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
function korean(n) {
  const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], u = ['', '십', '백', '천'], big = ['', '만', '억'];
  let s = '', g = 0; n = Math.round(n);
  if (n <= 0) return '일금 영원정';
  while (n > 0) { const part = n % 10000; n = Math.floor(n / 10000);
    if (part) { let t = '', x = part; for (let i = 0; i < 4; i++) { const k = x % 10; x = Math.floor(x / 10); if (k) t = d[k] + u[i] + t; } s = t + big[g] + s; }
    g++; }
  return '일금 ' + s + '원정';
}

/* ── 홈페이지 가격표 읽기 ── */
let P = null;   // { sizes:[{label, base, tiers:{스탠다드:{list,early,off}, ...}}], extras, colors, regions, multi, box, deadline }
function literal(src, name) {
  const m = new RegExp('const ' + name + ' *= *').exec(src); if (!m) return null;
  let i = m.index + m[0].length, d = 0;
  for (let j = i; j < src.length; j++) {
    const c = src[j];
    if (c === '{' || c === '[') d++;
    else if (c === '}' || c === ']') { d--; if (d === 0) return src.slice(i, j + 1); }
  }
  return null;
}
const lit = (src, name) => { const s = literal(src, name); return s ? Function('"use strict";return (' + s + ')')() : null; };
const won = s => +String(s).replace(/[^\d]/g, '');

async function loadPrices() {
  const html = await (await fetch('/index.html', { cache: 'no-store' })).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const sizes = [...doc.querySelectorAll('.sheet-row[data-size-card]')].map(row => {
    const b = row.querySelector('.sz b.num');
    const label = [...b.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim();
    const tiers = {};
    row.querySelectorAll('.tp').forEach(tp => {
      const k = tp.querySelector('.tp-k').textContent.trim();
      const tier = k.includes('단일') ? '단일 구성' : k;
      const off = tp.querySelector('.tp-off').textContent.trim();
      const early = won(/([\d,]+)원/.exec(tp.querySelector('b.num').textContent.replace(off, ''))[1]);
      const list = won(tp.querySelector('s.num').textContent);
      tiers[tier] = { list, early, off };
    });
    return { label, base: row.querySelector('.sz-box').textContent.trim(), tiers };
  });
  const js = [...doc.querySelectorAll('script')].map(s => s.textContent).join('\n');
  // 견적 계산기 쪽 데이터(배열형 COLORS)를 씀
  const qi = js.indexOf('const COLORS = [');
  const colors = qi >= 0 ? lit(js.slice(qi), 'COLORS').map(c => c.name) : ['레드 & 골드', '화이트 & 샴페인', '세이지 그린 & 골드', '네이비 & 골드'];
  const extras = (lit(js, 'EXTRAS') || []).map(x => ({ name: x.name, price: x.price, opts: (x.opts || []).map(o => ({ k: o.k, v: o.v.map(v => v[0]) })) }));
  const box = +(/BOX_EXTRA *= *(\d+)/.exec(js) || [0, 5000])[1];
  extras.push({ name: '시그니처 상자 추가', price: box, opts: [], unitLabel: '개당' });
  const multi = lit(js, 'MULTI') || { 2: 0.05, 3: 0.1 };
  const regions = lit(js, 'REGIONS') || [{ name: '서울', min: 0, max: 0 }];
  const dm = /1차 얼리버드 할인은 (\d+)월 (\d+)일까지/.exec(doc.body.textContent) || /1차 얼리버드 (\d+)월 (\d+)일 마감/.exec(doc.body.textContent);
  if (!sizes.length) throw new Error('가격표를 찾지 못했습니다');
  return { sizes, extras, colors, regions, multi, box, deadline: dm ? { m: +dm[1], d: +dm[2] } : null, at: new Date() };
}

/* ── 상태 ── */
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const blankTree = () => ({ size: '2.3m', tier: '프리미엄', color: '레드 & 골드', place: '', note: '' });
let S = null;
function freshState() {
  const seq = store.get('tl-quote-seq', 2);
  const y = new Date().getFullYear();
  return {
    no: `${y}-${String(seq + 1).padStart(3, '0')}`, date: today(), cust: '',
    trees: [blankTree()], addons: [], region: '서울', ship: 0, shipLabel: '', phase: autoPhase(), e2Pct: '', multiPct: '', extraNotes: '',
  };
}
function deadlineDate() {
  if (!P || !P.deadline) return null;
  const y = new Date().getFullYear();
  return new Date(y, P.deadline.m - 1, P.deadline.d, 23, 59, 59);
}
function autoPhase() { const dl = deadlineDate(); return !dl || new Date() <= dl ? 'e1' : 'e2'; }

/* ── 계산 ── */
const sizeOf = label => P.sizes.find(s => s.label === label) || P.sizes[0];
const typeName = label => /스노우|슬림/.test(label) ? `${label} 트리` : `${label} 그린 트리`;
function calc() {
  const problems = [];
  const trees = S.trees.map((t, i) => {
    const sz = sizeOf(t.size), names = Object.keys(sz.tiers);
    const tier = names.length === 1 ? names[0] : (sz.tiers[t.tier] ? t.tier : names[names.length - 1]);
    const pr = sz.tiers[tier];
    let early = pr.list;
    if (S.phase === 'e1') early = pr.early;
    else if (S.phase === 'e2') {
      const p = +S.e2Pct;
      if (S.e2Pct === '' || !(p >= 0)) problems.push('2차 얼리버드 할인율을 넣어 주세요.');
      else early = Math.floor(pr.list * (1 - p / 100) / 1000) * 1000;
    }
    return { ...t, n: i + 1, tier, off: pr.off, list: pr.list, early, base: sz.base, name: typeName(sz.label) };
  });
  const listSum = trees.reduce((a, t) => a + t.list, 0);
  const earlySum = trees.reduce((a, t) => a + t.early, 0);
  const n = trees.length;
  let pct = Math.round((P.multi[n] || 0) * 100);
  if (n >= 4) { if (S.multiPct === '') problems.push(`${n}그루 추가 할인율을 넣어 주세요.`); pct = +S.multiPct || 0; }
  const multiDisc = -Math.round(earlySum * pct / 100);
  const treeSub = earlySum + multiDisc;
  const addons = S.addons.map(a => {
    const ex = P.extras.find(x => x.name === a.name);
    const unit = ex ? ex.price : (+a.unit || 0);
    if (!ex && !a.name.trim()) problems.push('직접 입력한 추가 장식의 이름을 넣어 주세요.');
    const opt = [...(a.sel || []), a.memo].filter(Boolean).join(' · ');
    const ti = a.tree ? trees[a.tree - 1] : null;
    return { ...a, unit, opt, qty: +a.qty || 0, treeText: ti ? `${ti.n}번${ti.place ? ' · ' + ti.place : ''}` : '(미정)' };
  });
  const addonSum = addons.reduce((a, x) => a + x.qty * x.unit, 0);
  const ship = +S.ship || 0;
  const supply = treeSub + addonSum + ship;
  const vat = Math.round(supply * 0.1);
  const used = [...new Set(trees.filter(t => t.tier !== '단일 구성').map(t => t.tier))];
  const earlyLabel = S.phase === 'e2' ? `2차 얼리버드 할인 (${S.e2Pct || 0}%)`
    : used.length > 1 ? `1차 얼리버드 할인\n${used.map(u => u + ' ' + trees.find(t => t.tier === u).off).join(' · ')}`
    : `1차 얼리버드 할인 (${trees[0].off})`;
  if (!S.cust.trim()) problems.push('받는 곳 상호를 넣어 주세요.');
  return { trees, listSum, earlySum, earlyDisc: earlySum - listSum, pct, multiDisc, treeSub, addons, addonSum, ship, supply, vat, total: supply + vat, earlyLabel, problems };
}

// 넘치면 품목 줄 높이를 최소 높이까지 줄임. 그래도 넘치면 paperOver = true

const ROW = 30, ROW_MIN = 21;

function fitPaper() {
  const paper = $('#paper'), frame = $('#frame'), content = $('#content'), tb = $('#addonBody');

  tb.querySelectorAll('tr.blank').forEach(r => r.remove());

  if (free >= 0) {
    for (let i = Math.floor(free / ROW); i > 0; i--) tb.insertAdjacentHTML('beforeend', BLANK);
    const rows = paper.querySelectorAll('.grid tbody tr').length;

    setRow(h);

  const R = calc(); if (R.problems.length) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = '만드는 중…';
  try { await fn(R); saveHistory(R); } catch (err) { msg('파일을 만들지 못했습니다. 다시 눌러 주세요. (' + err.message + ')', false); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
$('#pdfBtn').onclick = e => run(e.currentTarget, async () => {
  const c = await capture();
  const pdf = new jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
  pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
  download(pdf.output('blob'), fileBase() + '.pdf'); msg(`${fileBase()}.pdf 저장했습니다.`);
});
$('#pngBtn').onclick = e => run(e.currentTarget, async () => {
  const c = await capture();
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  download(blob, fileBase() + '.png'); msg(`${fileBase()}.png 저장했습니다. 카톡에 사진으로 보내기 좋습니다.`);
});
$('#copyBtn').onclick = e => run(e.currentTarget, async R => {
  const lines = [`[트리랜드 견적] ${S.cust} 귀하 (No. ${S.no})`, ''];
  R.trees.forEach(t => lines.push(`${t.n}. ${t.place ? t.place + ' · ' : ''}${t.name} ${t.tier} · ${t.color}`));
  R.addons.forEach(a => lines.push(`  + ${a.name}${a.opt ? ' (' + a.opt + ')' : ''}${a.qty > 1 ? ' ×' + a.qty : ''} → ${a.treeText}`));
  lines.push('', `트리 정가 ${fmt(R.listSum)}원`);
  if (S.phase !== 'none') lines.push(`${R.earlyLabel} ${fmt(R.earlyDisc)}원`);
  if (R.pct) lines.push(`여러 그루 할인 ${R.pct}% ${fmt(R.multiDisc)}원`);
  if (R.addons.length) lines.push(`추가 장식 ${fmt(R.addonSum)}원`);
  lines.push(`운임 ${R.ship ? fmt(R.ship) + '원' : '무료'}`, `공급가액 ${fmt(R.supply)}원 + 부가세 ${fmt(R.vat)}원`, `합계 ${fmt(R.total)}원`);
  if (S.phase === 'e1' && P.deadline) lines.push('', `${P.deadline.m}월 ${P.deadline.d}일까지 계약 시 1차 얼리버드 가격으로 진행됩니다.`);
  await navigator.clipboard.writeText(lines.join('\n')); msg('카톡 요약을 복사했습니다.');
});

/* ── 발행 내역 ── */
function renderHist() {
  const list = store.get('tl-quote-hist', []);
  $('#hist').innerHTML = list.length ? list.map((h, i) => `<div class="it"><div><b>${esc(h.cust)}</b> <span class="m">No. ${esc(h.no)}</span><div class="m">${new Date(h.at).toLocaleDateString('ko-KR')} · 합계 ${fmt(h.total)}원</div></div>
    <div class="acts"><button type="button" class="ghost" data-open="${i}">열기</button><a class="ghost" href="/contract/admin.html?q=${encodeURIComponent(h.no)}" style="text-decoration:none">계약서 만들기</a><button type="button" class="link" data-copyq="${i}">복제</button><button type="button" class="link" data-delq="${i}">삭제</button></div></div>`).join('')
    : '<p class="hint">아직 저장한 견적이 없습니다. PDF·이미지를 저장하면 여기에 남습니다.</p>';
}
$('#hist').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const list = store.get('tl-quote-hist', []);
  if (b.dataset.open) { S = JSON.parse(JSON.stringify(list[+b.dataset.open].state)); renderForm(); scrollTo({ top: 0, behavior: 'smooth' }); }
  if (b.dataset.copyq) { const st = JSON.parse(JSON.stringify(list[+b.dataset.copyq].state)); const f = freshState(); S = { ...st, no: f.no, date: f.date, cust: '', phase: f.phase }; renderForm(); scrollTo({ top: 0, behavior: 'smooth' }); $('#cust').focus(); }
  if (b.dataset.delq && confirm('이 견적을 내역에서 지울까요?')) { list.splice(+b.dataset.delq, 1); store.set('tl-quote-hist', list); renderHist(); }
});

/* ── 도장 ── */
function stampState() { const has = !!store.get('tl-quote-stamp', null); $('#stampState').textContent = has ? '이 기기에서 바꾼 도장 사용 중' : '대표 도장 자동 적용'; $('#stampClear').hidden = !has; }
$('#stampFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), r = new FileReader();
  r.onload = () => { img.onload = () => {
    const c = document.createElement('canvas'), s = 160; c.width = c.height = s;
    const k = Math.min(s / img.width, s / img.height); c.getContext('2d').drawImage(img, (s - img.width * k) / 2, (s - img.height * k) / 2, img.width * k, img.height * k);
    if (!store.set('tl-quote-stamp', c.toDataURL('image/png'))) msg('이 브라우저에는 도장을 저장할 수 없습니다.', false);
    stampState(); update();
  }; img.src = r.result; };
  r.readAsDataURL(f);
};
$('#stampClear').onclick = () => { try { localStorage.removeItem('tl-quote-stamp'); } catch {} stampState(); update(); };

/* ── 시작 ── */
(async () => {
  try { P = await loadPrices(); }
  catch (err) { $('#status').textContent = '홈페이지 가격표를 불러오지 못했습니다. 새로고침해 주세요. (' + err.message + ')'; $('#status').className = 'status err'; return; }
  const dl = P.deadline ? `${P.deadline.m}월 ${P.deadline.d}일` : '';
  $('#status').textContent = `가격: 홈페이지 가격표 기준 (${P.at.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 불러옴)${dl ? ` · 1차 얼리버드 ${dl} 마감` : ''}`;
  $('#e1Label').textContent = `1차 얼리버드${dl ? ` (${dl}까지)` : ''}`;
  const draft = store.get('tl-quote-draft', null);
  S = draft && draft.trees ? draft : freshState();
  S.trees.forEach(t => { if (!P.sizes.some(s => s.label === t.size)) t.size = P.sizes[0].label; });
  $('#form').removeAttribute('aria-busy');
  stampState(); renderHist(); renderForm();
})();
})();
</script>
</body>
</html>
