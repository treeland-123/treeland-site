<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico">
<title>트리랜드 세금계산서 정보 등록</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 계약서 서명 화면(contract/index.html)과 같은 모양. 서명 없이 세금계산서·현금영수증 정보만 받음 */
:root{
  --bg:#fafaf9; --paper:#ffffff; --ink:#1a1a19; --sub:#5f5f5b; --line:#dcdcd7; --soft:#f0f0ec;
  --act:#1a1a19; --act-ink:#ffffff; --err:#b3261e;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --paper:#1d1d1b; --ink:#ececea; --sub:#a3a39e; --line:#3a3a37; --soft:#262624;
  --act:#ececea; --act-ink:#141413; --err:#f2b8b5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --paper:#1d1d1b; --ink:#ececea; --sub:#a3a39e; --line:#3a3a37; --soft:#262624;
  --act:#ececea; --act-ink:#141413; --err:#f2b8b5; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{padding-top:28px;display:flex;flex-direction:column;gap:6px}
.brand{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--sub)}
h1{font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.lead{margin:0;color:var(--sub);font-size:14px}
.demo{font-size:13px;background:var(--soft);border:1px dashed var(--line);padding:8px 12px;border-radius:6px;color:var(--sub)}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:16px;margin:0;display:flex;gap:10px;align-items:baseline}
h2 .n{font-size:12px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
dt{color:var(--sub);white-space:nowrap}
dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.amount{font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--sub)}
.field .req{color:var(--err)}
input[type=text],input[type=tel],input[type=email]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.taxbox{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.taxbox h3{margin:0;font-size:15px}
.taxbox .lead{font-size:13px}
.filebtn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.filebtn label{cursor:pointer;display:inline-flex;align-items:center;min-height:40px}
.addr-row{display:flex;gap:8px}.addr-row input{flex:1;min-width:0}.addr-row .ghost{flex:0 0 auto;padding:0 14px;font-size:14px}
#addrLayer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#addrLayer[hidden]{display:none}
#addrLayer .box{background:#fff;border-radius:10px;width:100%;max-width:480px;height:min(560px,85vh);display:flex;flex-direction:column;overflow:hidden}
#addrLayer .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e5e5e0;font-size:14px;color:#222}
#addrBox{flex:1}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:13px;color:var(--sub);margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:block;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;background:var(--bg)}
.opt input:checked+span{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.opt input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
details{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
summary{cursor:pointer;padding:12px 14px;font-size:14px;font-weight:500}
.terms{max-height:46vh;overflow:auto;padding:4px 14px 14px;font-size:13.5px;border-top:1px solid var(--line)}
.terms h3{font-size:14px;margin:14px 0 4px}
.terms p{margin:0 0 4px}
.terms .i{padding-left:1.2em;text-indent:-1.2em}
.terms .s{padding-left:2.4em;text-indent:-1.2em}
.key{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.key strong{font-size:13px;color:var(--sub);font-weight:500}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--act)}
.privacy{font-size:13px;color:var(--sub);margin:0 0 0 30px}
.pad{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:180px}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9a9a95;font-size:14px;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:13px}
.primary{background:var(--act);color:var(--act-ink);border:0;border-radius:8px;padding:15px;font-size:16px;font-weight:700;width:100%}
.primary[disabled]{opacity:.5;cursor:wait}
.error{color:var(--err);font-size:14px;margin:0}
.done{text-align:left}
.done p{margin:0}
footer{font-size:12px;color:var(--sub);text-align:center}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind label{position:relative;display:block}
.kind input{position:absolute;opacity:0;inset:0}
.kind span{display:block;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;cursor:pointer;background:var(--bg);text-align:center;font-weight:500}
.kind span small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.kind input:checked+span{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.kind input:checked+span small{color:inherit;opacity:.8}
.kind input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.note{font-size:13px;color:var(--sub);margin:0}
#wait{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div id="wait">불러오는 중…</div>
  <div id="app" hidden style="display:flex;flex-direction:column;gap:20px">
    <header>
      <div class="brand">TREELAND</div>
      <h1 id="ttl">세금계산서 발행 정보</h1>
      <p class="lead" id="lead"></p>
    </header>
    <section id="sumBox">
      <dl id="sum"></dl>
      <p class="note" id="prev" hidden></p>
    </section>
    <section id="formBox">
      <fieldset>
        <legend>사업자 여부 <span class="req" style="color:var(--err)">*</span></legend>
        <div class="kind">
          <label><input type="radio" name="kind" value="biz"><span>사업자입니다<small>세금계산서 발행</small></span></label>
          <label><input type="radio" name="kind" value="person"><span>사업자가 아닙니다<small>현금영수증 발행</small></span></label>
        </div>
      </fieldset>
      <div id="bizBox" hidden style="display:flex;flex-direction:column;gap:12px">
        <div class="kind" id="modeBox">
          <label><input type="radio" name="mode" value="doc"><span>사업자등록증 올리기<small>사진 또는 PDF</small></span></label>
          <label><input type="radio" name="mode" value="text"><span>직접 입력<small>상호·업종·사업자번호</small></span></label>
        </div>
        <div id="docBox" hidden>
          <div class="field"><label>사업자등록증 사진 또는 PDF <span class="req">*</span></label>
            <div class="filebtn"><label class="ghost" for="t-file">파일 고르기</label><input type="file" id="t-file" accept="image/*,application/pdf" hidden><span id="t-fileName">휴대폰으로 찍은 사진도 됩니다.</span></div>
          </div>
        </div>
        <div id="textBox" hidden style="display:flex;flex-direction:column;gap:12px">
          <div class="grid2">
            <div class="field"><label for="t-name">상호 <span class="req">*</span></label><input type="text" id="t-name" autocomplete="organization"></div>
            <div class="field"><label for="t-item">업종 <span class="req">*</span></label><input type="text" id="t-item" placeholder="예: 의원, 카페, 학원"></div>
            <div class="field"><label for="t-biz">사업자등록번호 <span class="req">*</span></label><input type="text" id="t-biz" inputmode="numeric" placeholder="000-00-00000"></div>
            <div class="field" id="repField" hidden><label for="t-rep">대표자 <span class="req">*</span></label><input type="text" id="t-rep"></div>
          </div>
        </div>
        <div class="field"><label for="t-email">세금계산서 받을 이메일 <span class="req">*</span></label><input type="email" id="t-email" autocomplete="email"></div>
      </div>
      <div id="personBox" hidden>
        <div class="field"><label for="t-phone">현금영수증 받을 휴대폰 번호 <span class="req">*</span></label><input type="tel" id="t-phone" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000"></div>
      </div>
      <p class="error" id="err" role="alert" hidden></p>
      <button type="button" class="primary" id="save">저장</button>
    </section>
    <section id="doneBox" hidden class="done">
      <h2>등록했습니다</h2>
      <p id="doneMsg"></p>
      <p class="note">고칠 내용이 있으면 이 링크를 다시 열어 고친 뒤 저장해 주세요.</p>
    </section>
  </div>
  <footer>트리랜드 (TREELAND) · 대표 홍준서 · 사업자등록번호 360-69-00592 · 070-4571-7467 · info@treeland.kr</footer>
</div>
<script>
"use strict";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxSKXLeVZoI-Qx2rieXI_f4DjKdf7jNzI9S_vtBrJJnqMYjOBvzs9TUHxQK7Ko0h-9oDg/exec";
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search), ID = P.get("id") || "", K = P.get("k") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const won = n => (Math.round(n) || 0).toLocaleString("ko-KR");
const val = id => $(id).value.trim();
async function api(body){ const r = await fetch(ENDPOINT, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) }); return r.json(); }
function stop(msg){ $("#wait").hidden = true; $("#app").hidden = false; $("#sumBox").hidden = true; $("#formBox").hidden = true; $("#ttl").textContent = "열 수 없는 링크입니다"; $("#lead").textContent = msg; }
function fmtBiz(v){ const d = String(v || "").replace(/\D/g, "").slice(0, 10); return d.length > 5 ? d.slice(0, 3) + "-" + d.slice(3, 5) + "-" + d.slice(5) : d.length > 3 ? d.slice(0, 3) + "-" + d.slice(3) : d; }
function fmtTel(v){ const d = String(v || "").replace(/\D/g, "").slice(0, 11); return d.length > 7 ? d.slice(0, 3) + "-" + d.slice(3, d.length - 4) + "-" + d.slice(-4) : d.length > 3 ? d.slice(0, 3) + "-" + d.slice(3) : d; }
$("#t-biz").addEventListener("input", e => e.target.value = fmtBiz(e.target.value));
$("#t-phone").addEventListener("input", e => e.target.value = fmtTel(e.target.value));
function setKind(k){ $("#bizBox").hidden = k !== "biz"; $("#personBox").hidden = k !== "person"; }
function setMode(m){ $("#docBox").hidden = m !== "doc"; $("#textBox").hidden = m !== "text"; }
document.querySelectorAll("input[name=kind]").forEach(r => r.addEventListener("change", () => setKind(r.value)));
document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", () => setMode(r.value)));
const kind = () => (document.querySelector("input[name=kind]:checked") || {}).value || "";
const mode = () => (document.querySelector("input[name=mode]:checked") || {}).value || "";

/* 사업자등록증: 사진이면 줄여서 보냄 (계약서 화면과 같은 방식) */
let DOC = null;
$("#t-file").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return; const show = t => $("#t-fileName").textContent = t;
  try{
    if(f.type === "application/pdf"){
      if(f.size > 4 * 1024 * 1024){ DOC = null; show("PDF가 너무 큽니다(4MB까지). 사진으로 올려 주세요."); return; }
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(f); });
      DOC = { b64, mime:"application/pdf" };
    }else{
      const url = URL.createObjectURL(f), img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      DOC = { b64: c.toDataURL("image/jpeg", 0.82).split(",")[1], mime:"image/jpeg" };
    }
    show("올림: " + f.name);
  }catch(err){ DOC = null; show("파일을 읽지 못했습니다. 다른 사진으로 골라 주세요."); }
});

let C = null;
(async function(){
  if(!ID || !K){ stop("주소가 잘렸을 수 있습니다. 받으신 링크를 다시 눌러 주세요."); return; }
  let j; try{ j = await api({ action:"taxGet", id:ID, k:K }); }catch(e){ stop("연결이 원활하지 않습니다. 잠시 뒤 다시 열어 주세요."); return; }
  if(!j.ok){ stop(j.error === "status" ? "계약서 서명이 끝난 뒤 등록할 수 있습니다." : "링크가 올바르지 않습니다. 트리랜드(070-4571-7467)로 문의해 주세요."); return; }
  C = j; const t = j.tax || {};
  $("#wait").hidden = true; $("#app").hidden = false;
  $("#lead").textContent = j.pay === "카드 결제"
    ? "카드로 결제하시면 카드 영수증이 증빙이 되어 세금계산서는 따로 발행하지 않습니다. 계좌이체로 바꾸신 경우에만 등록해 주세요."
    : "세금계산서 발행을 위해 사업자등록증을 올리거나 사업자 정보를 넣어 주세요. 사업자가 아니시면 현금영수증 번호를 넣어 주세요.";
  $("#sum").innerHTML = `<dt>상호</dt><dd>${esc(j.name)}</dd><dt>결제 금액</dt><dd class="amount">${won(j.total)}원 (부가세 포함)</dd>`;
  if(t.at){ $("#prev").hidden = false; $("#prev").textContent = `${t.at}에 등록한 내용입니다. 바뀐 내용이 있으면 고쳐서 다시 저장해 주세요.`; }
  $("#t-biz").value = fmtBiz(t.biz || j.biz); $("#t-name").value = t.name || j.name; $("#t-rep").value = t.rep || j.rep;
  $("#t-email").value = t.email || j.email; $("#t-item").value = t.item; $("#t-phone").value = fmtTel(t.phone);
  $("#repField").hidden = !!j.rep;   // 대표자는 계약서에 적힌 값을 씀, 없을 때만 받음
  if(t.hasDoc) $("#t-fileName").textContent = "이미 올린 사업자등록증이 있습니다. 바뀐 경우에만 다시 올려 주세요.";
  const k = t.kind || (j.biz ? "biz" : "");
  if(k){ const r = document.querySelector(`input[name=kind][value=${k}]`); if(r){ r.checked = true; setKind(k); } }
  const m = t.hasDoc ? "doc" : (t.item ? "text" : "");
  if(m){ const r = document.querySelector(`input[name=mode][value=${m}]`); if(r){ r.checked = true; setMode(m); } }
})();

function err(m, el){ $("#err").textContent = m; $("#err").hidden = false; if(el){ el.focus(); el.scrollIntoView({ block:"center" }); } }
$("#save").addEventListener("click", async () => {
  $("#err").hidden = true; const k = kind();
  if(!k) return err("사업자인지 먼저 골라 주세요.");
  let data;
  if(k === "biz"){
    const m = mode();
    if(!m) return err("사업자등록증을 올릴지, 직접 입력할지 골라 주세요.");
    if(m === "doc" && !DOC && !(C.tax && C.tax.hasDoc)) return err("사업자등록증 사진이나 PDF를 골라 주세요.", $("#t-file").previousElementSibling);
    if(m === "text"){
      const req = [["#t-name","상호"],["#t-item","업종"],["#t-biz","사업자등록번호"]].concat($("#repField").hidden ? [] : [["#t-rep","대표자"]]);
      for(const [id, l] of req) if(!val(id)) return err(`${l}을(를) 입력해 주세요.`, $(id));
      if(val("#t-biz").replace(/\D/g, "").length !== 10) return err("사업자등록번호 10자리를 확인해 주세요.", $("#t-biz"));
    }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("#t-email"))) return err("세금계산서 받을 이메일을 확인해 주세요.", $("#t-email"));
    data = m === "doc" ? { kind:"biz", mode:"doc", email:val("#t-email"), doc: DOC }
      : { kind:"biz", mode:"text", biz:val("#t-biz"), name:val("#t-name"), item:val("#t-item"), rep: $("#repField").hidden ? "" : val("#t-rep"), email:val("#t-email") };
  }else{
    const d = val("#t-phone").replace(/\D/g, ""); if(d.length < 10 || d.length > 11) return err("휴대폰 번호를 확인해 주세요.", $("#t-phone"));
    data = { kind:"person", phone:val("#t-phone") };
  }
  const b = $("#save"); b.disabled = true; b.textContent = "저장하는 중…";
  try{
    const j = await api({ action:"taxSet", id:ID, k:K, data });
    if(!j.ok) throw new Error(j.error === "link" ? "링크가 올바르지 않습니다." : j.error === "status" ? "계약서 서명이 끝난 뒤 등록할 수 있습니다." : (j.error || "저장하지 못했습니다."));
    $("#formBox").hidden = true; $("#doneBox").hidden = false;
    $("#doneMsg").textContent = k === "biz" ? `세금계산서는 ${data.email}(으)로 발행됩니다.` : `현금영수증은 ${data.phone} 번호로 발행됩니다.`;
    window.scrollTo({ top:0 });
  }catch(e){ err(e.message || "저장하지 못했습니다. 다시 눌러 주세요."); }
  finally{ b.disabled = false; b.textContent = "저장"; }
});
</script>
</body>
</html>
